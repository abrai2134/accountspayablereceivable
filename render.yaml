# One-click deploy to Render: New > Blueprint, point it at this repository.
# Render asks for the admin username and password on the first deploy.
services:
  - type: web
    name: wellworth-accounts
    runtime: python
    plan: starter            # needs the disk, or every payment marked is lost on restart
    buildCommand: pip install -r requirements.txt
    # one worker: logins and the database live on this one machine
    startCommand: gunicorn -w 1 --threads 8 --timeout 120 -b 0.0.0.0:$PORT "accounts.main:create_app()"
    healthCheckPath: /health
    envVars:
      - key: ACCOUNTS_ADMIN_USER
        sync: false
      - key: ACCOUNTS_ADMIN_PASSWORD
        sync: false
      - key: ACCOUNTS_ADMIN_NAME
        value: "Abrar"
      - key: ACCOUNTS_HTTPS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
    disk:
      name: accounts-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
